<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexo Publisher</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Source+Serif+4:wght@400;600&display=swap"><link rel="stylesheet" href="style.css">
<style>
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-top:18px}
.panel h2{margin:0 0 12px;font-size:18px}
.btn{font-family:var(--display);font-weight:600;font-size:15px;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--band);color:var(--band-fg)}
.btn.gold{background:var(--band-gold);color:#0F1E36}
.btn:disabled{opacity:.45;cursor:not-allowed}
.creator{display:flex;align-items:center;gap:14px;font-family:var(--display)}
.creator img{width:52px;height:52px;border-radius:50%;border:2px solid var(--band-gold)}
.creator b{display:block;font-size:16px}.creator span{font-size:13px;color:var(--muted)}
label.f{display:block;font-family:var(--display);font-size:13px;font-weight:600;margin:16px 0 6px}
select,textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:start}
@media (max-width:640px){.row{grid-template-columns:1fr}}
video{width:100%;max-width:200px;aspect-ratio:9/16;background:#000;border-radius:12px}
.checks label{display:flex;gap:10px;align-items:center;font-family:var(--display);font-size:14px;margin:6px 0}
.hint{font-family:var(--display);font-size:13px;color:var(--muted);margin:6px 0 0}
.consent{font-family:var(--display);font-size:13px;color:var(--muted);margin:18px 0 12px}
.status{font-family:var(--display);font-size:14px;margin-top:14px}
.sub{margin-left:26px}
</style></head><body>
<header class="band"><div class="wrap"><a class="brand" href="index.html"><svg viewBox="0 0 300 120" aria-hidden="true"><line x1="60" y1="60" x2="240" y2="60" stroke="#E0B252" stroke-width="12"/><circle cx="60" cy="60" r="40" fill="#0F1E36" stroke="#E0B252" stroke-width="12"/><circle cx="240" cy="60" r="40" fill="#0F1E36" stroke="#E0B252" stroke-width="12"/><circle cx="150" cy="60" r="20" fill="#E0B252"/></svg><span>NEXO <b>PUBLISHER</b></span></a><nav><a href="index.html">Home</a><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a></nav></div></header>
<main><div class="wrap">
<h1 style="font-size:30px">Publish to TikTok</h1>
<p class="meta">Internal tool. Posts Nexo Commerce's own videos to our own TikTok account.</p>

<div class="panel" id="p-connect">
  <h2>1. Account</h2>
  <div id="who"><button class="btn" id="connect">Connect with TikTok</button></div>
</div>

<div class="panel" id="p-post" hidden>
  <h2>2. New post</h2>
  <label class="f" for="video">Video</label>
  <select id="video"></select>
  <div class="row" style="margin-top:16px">
    <video id="preview" controls playsinline></video>
    <div>
      <label class="f" for="title" style="margin-top:0">Caption</label>
      <textarea id="title" maxlength="2200" placeholder="Write a caption"></textarea>
      <label class="f" for="privacy">Who can view this video</label>
      <select id="privacy"><option value="" selected disabled>Select privacy</option></select>
      <p class="hint" id="privhint"></p>
      <label class="f">Allow users to</label>
      <div class="checks">
        <label><input type="checkbox" id="c-comment"> Comment</label>
        <label><input type="checkbox" id="c-duet"> Duet</label>
        <label><input type="checkbox" id="c-stitch"> Stitch</label>
      </div>
      <label class="f">Content disclosure</label>
      <div class="checks">
        <label><input type="checkbox" id="disclose"> Disclose video content</label>
        <div class="sub" id="disc-opts" hidden>
          <label><input type="checkbox" id="b-own"> Your brand <span class="hint" style="margin:0">(promoting yourself or your own business)</span></label>
          <label><input type="checkbox" id="b-paid"> Branded content <span class="hint" style="margin:0">(paid partnership with a third party)</span></label>
          <p class="hint" id="dischint"></p>
        </div>
      </div>
    </div>
  </div>
  <p class="consent" id="consent"></p>
  <button class="btn gold" id="post" disabled>Post to TikTok</button>
  <p class="status" id="status" role="status"></p>
</div>
</div></main>
<footer><div class="wrap"><span>© 2026 Nexo Commerce · Toulouse, France</span><span><a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></span></div></footer>
<script>
const L = "http://127.0.0.1:8787";
const $ = id => document.getElementById(id);
const LABEL = {PUBLIC_TO_EVERYONE:"Everyone", MUTUAL_FOLLOW_FRIENDS:"Friends", FOLLOWER_OF_CREATOR:"Followers", SELF_ONLY:"Only me"};
const MUSIC = '<a href="https://www.tiktok.com/legal/page/global/music-usage-confirmation/en" target="_blank" rel="noopener">Music Usage Confirmation</a>';
const BRAND = '<a href="https://www.tiktok.com/legal/page/global/bc-policy/en" target="_blank" rel="noopener">Branded Content Policy</a>';
let creator = null, videos = [];

$("connect").onclick = async () => {
  const c = await (await fetch(L + "/api/config")).json();
  const state = crypto.randomUUID().replace(/-/g, "");
  sessionStorage.setItem("nx_state", state);
  location.href = "https://www.tiktok.com/v2/auth/authorize/?client_key=" + c.client_key + "&scope=user.info.basic,video.upload,video.publish&response_type=code&redirect_uri=" + encodeURIComponent(c.redirect_uri) + "&state=" + state;
};

async function load() {
  const c = await (await fetch(L + "/api/config")).json();
  if (!c.connected) return;
  const r = await (await fetch(L + "/api/creator")).json();
  if (!r.data || !r.data.creator_nickname) return;
  creator = r.data;
  $("who").innerHTML = '<div class="creator"><img alt="" src="' + creator.creator_avatar_url + '"><div><b>' + creator.creator_nickname + '</b><span>@' + creator.creator_username + ' · posting as this account</span></div></div>';
  for (const p of creator.privacy_level_options) { const o = document.createElement("option"); o.value = p; o.textContent = LABEL[p] || p; $("privacy").appendChild(o); }
  if (creator.comment_disabled) { $("c-comment").disabled = true; }
  if (creator.duet_disabled) { $("c-duet").disabled = true; }
  if (creator.stitch_disabled) { $("c-stitch").disabled = true; }
  videos = await (await fetch(L + "/api/videos")).json();
  for (const v of videos) { const o = document.createElement("option"); o.value = v.id; o.textContent = v.name; $("video").appendChild(o); }
  $("p-post").hidden = false; pick(); refresh();
}
function pick() { $("preview").src = L + "/api/video?id=" + encodeURIComponent($("video").value); }
function refresh() {
  const d = $("disclose").checked, own = $("b-own").checked, paid = $("b-paid").checked;
  $("disc-opts").hidden = !d;
  const self = $("privacy").querySelector('option[value="SELF_ONLY"]');
  if (self) { self.disabled = d && paid; if (d && paid && $("privacy").value === "SELF_ONLY") $("privacy").value = ""; }
  $("privhint").textContent = d && paid ? "Branded content visibility cannot be set to private." : "";
  $("dischint").textContent = d && !own && !paid ? "You need to indicate if your content promotes yourself, a third party, or both." : (d && paid ? "Your photo/video will be labeled as \"Paid partnership\"." : (d && own ? "Your photo/video will be labeled as \"Promotional content\"." : ""));
  $("consent").innerHTML = "By posting, you agree to TikTok's " + (d && paid ? BRAND + " and " : "") + MUSIC + ".";
  $("post").disabled = !$("privacy").value || (d && !own && !paid);
}
["privacy","disclose","b-own","b-paid"].forEach(id => $(id).addEventListener("change", refresh));
$("video").addEventListener("change", pick);

$("post").onclick = async () => {
  $("post").disabled = true; $("status").textContent = "Uploading video to TikTok...";
  const d = $("disclose").checked;
  const r = await (await fetch(L + "/api/post", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({
    video: $("video").value, title: $("title").value, privacy_level: $("privacy").value,
    allow_comment: $("c-comment").checked, allow_duet: $("c-duet").checked, allow_stitch: $("c-stitch").checked,
    brand_organic: d && $("b-own").checked, brand_content: d && $("b-paid").checked }) })).json();
  if (!r.publish_id) { $("status").textContent = "Error: " + ((r.error && (r.error.code || r.error)) || "unknown"); $("post").disabled = false; return; }
  $("status").textContent = "Video sent. TikTok is processing it; it may take a few minutes to appear on your profile.";
  for (let i = 0; i < 40; i++) {
    await new Promise(z => setTimeout(z, 5000));
    const s = await (await fetch(L + "/api/status?id=" + encodeURIComponent(r.publish_id))).json();
    const st = s.data && s.data.status;
    if (st === "PUBLISH_COMPLETE") { $("status").textContent = "Posted. Your video is now on your TikTok profile."; break; }
    if (st === "FAILED") { $("status").textContent = "TikTok could not post the video: " + s.data.fail_reason; break; }
    $("status").textContent = "Processing on TikTok (" + (st || "pending").toLowerCase().replace(/_/g, " ") + "). This may take a few minutes.";
  }
  $("post").disabled = false;
};
load().catch(() => { $("who").insertAdjacentHTML("beforeend", '<p class="hint">Start the local Nexo Publisher service to continue.</p>'); });
</script>
</body></html>
